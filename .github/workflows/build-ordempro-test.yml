name: Gerar APK de teste do OrdemPro

on:
  workflow_dispatch:
  push:
    paths:
      - "ordempro/**"
      - ".github/workflows/build-ordempro-test.yml"

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ordempro
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gerar APK debug
        run: gradle :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OrdemPro-teste-apk
          path: ordempro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
